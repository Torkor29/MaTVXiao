# Publishes dist/*.apk as a GitHub release whenever dist/VERSION changes on main (tag v<VERSION>).
# The APKs are built and signed off GitHub (the signing keys never come here); the TVs download them from the release.
name: Release
on:
  push:
    branches: [main]
    paths: ["dist/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="$(tr -d ' \r\n' < dist/VERSION)"
          if gh release view "v$v" >/dev/null 2>&1; then echo "v$v already published"; exit 0; fi
          gh release create "v$v" dist/MaTV-Home.apk dist/MaTV-Live.apk \
            --target "$GITHUB_SHA" --title "MaTV $v" --notes-file dist/NOTES.md
