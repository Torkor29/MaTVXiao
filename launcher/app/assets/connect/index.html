<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MaTV">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>MaTV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0B1020;
  --ink:#F5F3EE;
  --ink2:rgba(235,235,245,.62);
  --ink3:rgba(235,235,245,.38);
  --glass:rgba(255,255,255,.075);
  --glass2:rgba(255,255,255,.13);
  --edge:rgba(255,255,255,.12);
  --light:#F3D7A3;
  --onlight:#1C1608;
  --ok:#7BE0A8;
  --warn:#FFB38A;
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",system-ui,sans-serif;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,system-ui,sans-serif;
  --placard:"Instrument Serif",ui-serif,Georgia,serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  --spring:cubic-bezier(.32,1.25,.4,1);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--night);color:var(--ink);font:400 16px/1.45 var(--ui);-webkit-font-smoothing:antialiased;min-height:100%}
body{overflow-x:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input{font:inherit;color:inherit}
img{display:block}
:focus-visible{outline:2px solid var(--light);outline-offset:3px;border-radius:10px}

/* The room: the TV's wallpaper, blurred, behind everything */
#ambient{position:fixed;inset:-10%;z-index:0;background:var(--night) center/cover no-repeat;filter:blur(60px) saturate(1.4) brightness(.55);transform:scale(1.1);transition:background-image 1.2s var(--ease),opacity 1.2s}
#ambient::after{content:"";position:fixed;inset:0;background:linear-gradient(180deg,rgba(11,16,32,.35),rgba(11,16,32,.82) 55%,var(--night))}

.app{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1fr);min-height:100vh}
main{padding:calc(var(--safe-t) + 14px) 18px calc(110px + var(--safe-b));max-width:1180px;width:100%;min-width:0;margin:0 auto}

/* Navigation: a glass tab bar on phones, a column on wide screens */
nav.tabs{position:fixed;z-index:20;left:50%;bottom:calc(12px + var(--safe-b));transform:translateX(-50%);display:flex;gap:2px;padding:6px;border-radius:999px;
  background:rgba(28,30,40,.55);backdrop-filter:blur(30px) saturate(1.8);-webkit-backdrop-filter:blur(30px) saturate(1.8);border:1px solid var(--edge);box-shadow:0 20px 50px rgba(0,0,0,.45)}
nav.tabs{width:min(calc(100% - 16px),440px)}
nav.tabs button{flex:1;min-width:0;white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 6px;letter-spacing:-.01em;border-radius:999px;color:var(--ink3);font-size:10.5px;font-weight:600;transition:color .25s,background .25s}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--ink);background:rgba(255,255,255,.12)}
.brand{display:none}
@media (min-width:980px){
  .app{grid-template-columns:240px minmax(0,1fr)}
  nav.tabs{width:auto;position:sticky;top:0;left:auto;bottom:auto;transform:none;height:100vh;flex-direction:column;border-radius:0;padding:28px 14px;gap:4px;background:rgba(10,13,24,.35);border:0;border-right:1px solid var(--edge);box-shadow:none}
  nav.tabs button{flex:none;flex-direction:row;gap:12px;min-width:0;padding:11px 14px;border-radius:12px;font-size:15px;font-weight:550;justify-content:flex-start}
  nav.tabs button svg{width:22px;height:22px}
  .brand{display:flex;align-items:center;gap:10px;padding:0 10px 26px;font:700 20px var(--display);letter-spacing:-.01em}
  .brand i{width:30px;height:30px;border-radius:9px;background:url(icon.png) center/cover}
  main{padding:40px 44px 60px}
}

/* Type */
h1.large{font:700 34px/1.1 var(--display);letter-spacing:-.025em;margin:8px 0 4px}
.sub{color:var(--ink2);margin:0 0 22px;font-size:15px}
h2{font:650 21px/1.2 var(--display);letter-spacing:-.015em;margin:34px 0 12px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h2 small{font:500 14px var(--ui);color:var(--ink2);letter-spacing:0}
.placard{font:italic 400 26px/1.15 var(--placard);letter-spacing:.005em}

/* The miniature TV: the one bold element */
.tv{position:relative;margin:6px auto 0;max-width:760px}
.tv .screen{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#05070d;
  box-shadow:0 0 0 1px rgba(255,255,255,.14),0 0 0 7px #0a0b0f,0 0 0 8px rgba(255,255,255,.08),0 40px 90px -20px rgba(0,0,0,.85),0 0 120px -30px var(--glow,rgba(243,215,163,.25))}
.tv .screen img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.6s var(--ease),transform 9s linear;transform:scale(1.04)}
.tv .screen img.on{opacity:1;transform:scale(1)}
.tv .screen::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.10),rgba(255,255,255,0) 38%);pointer-events:none}
.tv .clock{position:absolute;left:5%;bottom:8%;font:200 clamp(30px,8vw,64px)/1 var(--display);letter-spacing:-.02em;text-shadow:0 2px 24px rgba(0,0,0,.45)}
.tv .clock small{display:block;font:500 clamp(10px,2.2vw,15px) var(--ui);letter-spacing:.02em;margin-top:6px;opacity:.85}
.tv .cap{position:absolute;right:5%;bottom:8%;text-align:right;max-width:46%;text-shadow:0 2px 18px rgba(0,0,0,.6)}
.tv .cap b{display:block;font:italic 400 clamp(15px,3.4vw,24px)/1.1 var(--placard)}
.tv .cap span{font-size:clamp(9px,1.8vw,12px);opacity:.8}
.tv .stand{width:22%;height:10px;margin:14px auto 0;border-radius:0 0 10px 10px;background:linear-gradient(#1b1d24,#0c0d11);box-shadow:0 18px 30px rgba(0,0,0,.6)}
.tv .empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink3);font-size:14px}

.status{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:20px 0 0}
.pill{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;background:var(--glass);border:1px solid var(--edge);font-size:13px;color:var(--ink2);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok)}

.actions{display:flex;gap:10px;justify-content:center;margin:20px 0 0;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 22px;border-radius:999px;font-weight:620;font-size:16px;background:var(--glass2);border:1px solid var(--edge);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);transition:transform .15s var(--ease),background .2s}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--light);color:var(--onlight);border-color:transparent;box-shadow:0 10px 30px -8px rgba(243,215,163,.55)}
.btn.small{height:38px;padding:0 16px;font-size:14px}
.btn.danger{color:#FF8A80}
.btn svg{width:20px;height:20px}
.btn[disabled]{opacity:.45;pointer-events:none}

/* Grouped settings, iOS style */
.group{border-radius:18px;background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(28px) saturate(1.5);-webkit-backdrop-filter:blur(28px) saturate(1.5);overflow:hidden}
.row{display:flex;align-items:center;gap:14px;min-height:56px;padding:10px 16px}
.row+.row{border-top:1px solid rgba(255,255,255,.07)}
.row .label{flex:1;min-width:0}
.row .label b{display:block;font-weight:560}
.row .label span{display:block;font-size:13px;color:var(--ink2)}
.seg{display:flex;padding:3px;border-radius:12px;background:rgba(0,0,0,.28);gap:2px;flex-wrap:wrap}
.seg button{padding:7px 12px;border-radius:9px;font-size:14px;font-weight:560;color:var(--ink2);transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:rgba(255,255,255,.18);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.25)}
.switch{position:relative;width:51px;height:31px;border-radius:999px;background:rgba(120,120,128,.36);transition:background .25s;flex:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.3);transition:transform .3s var(--spring)}
.switch[aria-checked="true"]{background:var(--ok)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.row.stack{flex-direction:column;align-items:stretch}
.row>svg{width:18px;height:18px;color:var(--ink3);flex:none}
button.row{width:100%;text-align:left;color:inherit}

/* Chips (collections) */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 6px;margin:0 -18px;padding-left:18px;padding-right:18px}
.chips::-webkit-scrollbar{display:none}
.chips.ideas{flex-wrap:wrap;overflow:visible;margin:0 0 6px;padding:2px 0 6px}
@media (min-width:980px){.chips{margin:0;padding-left:2px;flex-wrap:wrap}}
.group .chips{flex-wrap:wrap;margin:0;padding:2px 0 4px}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 15px;border-radius:999px;background:var(--glass);border:1px solid var(--edge);font-size:14px;font-weight:560;color:var(--ink2);white-space:nowrap;transition:background .2s,color .2s}
.chip[aria-pressed="true"]{background:var(--ink);color:#111;border-color:transparent}
.chip em{font-style:normal;opacity:.6;font-weight:500}

/* Themes: big cover rail */
.rail{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:4px 0 10px}
.rail::-webkit-scrollbar{display:none}
@media (min-width:700px){.rail{grid-template-columns:repeat(4,minmax(0,1fr))}}
.theme{position:relative;aspect-ratio:16/10;border-radius:20px;overflow:hidden;text-align:left;background:#111}
.remote .power{align-self:center;margin-bottom:6px}
.theme img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .8s var(--ease)}
.theme:hover img{transform:scale(1.04)}
.theme::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 45%,rgba(0,0,0,.7))}
.theme .name{position:absolute;left:12px;right:10px;bottom:10px;z-index:1}
.theme .name b{display:block;font:italic 400 22px/1.05 var(--placard)}
.theme .name span{font-size:12px;color:rgba(255,255,255,.8)}
.theme[aria-pressed="true"]{box-shadow:0 0 0 2px var(--light)}

/* Picture grid */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:700px){.grid{grid-template-columns:repeat(3,1fr);gap:14px}}
@media (min-width:1200px){.grid{grid-template-columns:repeat(4,1fr)}}
.tile{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:rgba(255,255,255,.05);text-align:left}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s,transform .3s var(--ease)}
.tile img.ok{opacity:1}
.tile:active img{transform:scale(.97)}
.tile .badge{position:absolute;top:7px;right:7px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:rgba(20,20,26,.55);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.16)}
.tile .badge svg{width:16px;height:16px}
.tile .badge.on{background:var(--ok);color:#06210f;border-color:transparent}
.tile .badge.busy svg{animation:spin 1s linear infinite}
.tile.off img{filter:grayscale(1) brightness(.55)}
.tile .tag{position:absolute;left:8px;bottom:7px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;background:rgba(0,0,0,.5);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.tile.sel{box-shadow:0 0 0 3px var(--light)}
.tile .pick{position:absolute;top:7px;left:7px;width:26px;height:26px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.25)}
.tile.sel .pick{background:var(--light);border-color:var(--light)}
.tile.sel .pick::after{content:"";position:absolute;left:7px;top:3px;width:6px;height:11px;border:solid var(--onlight);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
@keyframes spin{to{transform:rotate(360deg)}}

.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 14px}
.search{flex:1;min-width:200px;display:flex;align-items:center;gap:10px;height:46px;padding:0 16px;border-radius:14px;background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.search svg{width:18px;height:18px;color:var(--ink3);flex:none}
.search input{flex:1;background:none;border:0;outline:0;font-size:16px;min-width:0}
.search input::placeholder{color:var(--ink3)}
.more{display:flex;justify-content:center;margin:22px 0}
.note{color:var(--ink2);font-size:14px;text-align:center;padding:30px 10px}
.credit{color:var(--ink3);font-size:12px;margin-top:22px;text-align:center}
.credit a{color:var(--ink2)}

/* Sheets */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);opacity:0;transition:opacity .3s;pointer-events:none}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:41;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:10px 20px calc(24px + var(--safe-b));
  background:rgba(24,26,36,.82);backdrop-filter:blur(40px) saturate(1.8);-webkit-backdrop-filter:blur(40px) saturate(1.8);border-top:1px solid var(--edge);
  transform:translateY(105%);transition:transform .45s var(--ease),visibility 0s linear .45s}
.sheet{visibility:hidden}
.sheet.on{transform:none;visibility:visible;transition:transform .45s var(--ease),visibility 0s}
.sheet .top{position:sticky;top:-10px;z-index:2;display:flex;align-items:center;justify-content:flex-end;height:46px;margin:-10px -20px 6px;padding:0 14px;background:linear-gradient(rgba(26,28,38,.97) 70%,rgba(26,28,38,0))}
.sheet .grab{position:absolute;left:50%;top:10px;transform:translateX(-50%);width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.25)}
@media (min-width:760px){.sheet{max-height:88vh;left:50%;right:auto;bottom:auto;top:50%;width:min(720px,92vw);border-radius:28px;border:1px solid var(--edge);transform:translate(-50%,-46%) scale(.96);opacity:0;transition:transform .4s var(--ease),opacity .3s,visibility 0s linear .4s}
  .sheet.on{transform:translate(-50%,-50%);opacity:1;visibility:visible;transition:transform .4s var(--ease),opacity .3s,visibility 0s}.sheet .grab{display:none}}
.sheet .tv{margin:6px 0 18px}
.sheet .meta{color:var(--ink2);font-size:14px;margin:6px 0 0}
.sheet .meta a{color:var(--ink2)}
.sheet h3{font:650 15px var(--ui);color:var(--ink2);margin:22px 0 10px}
.sheet .bar{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.sheet .bar .btn{flex:1 1 180px;white-space:nowrap}
.close{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center;flex:none}
.close svg{width:16px;height:16px}

/* Crop: a 16:9 window over the photo */
.crop{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000;touch-action:none;cursor:grab;margin:8px 0 6px}
.crop img{position:absolute;max-width:none;user-select:none;-webkit-user-drag:none;pointer-events:none}
.crop .guide{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.18) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.18) 1px,transparent 1px);background-size:33.34% 33.34%;opacity:0;transition:opacity .2s}
.crop.drag .guide{opacity:1}
.hint{font-size:13px;color:var(--ink3);text-align:center}
.queue{display:flex;gap:8px;overflow-x:auto;margin:12px 0 0}
.queue button{flex:none;width:72px;aspect-ratio:16/9;border-radius:8px;overflow:hidden;opacity:.55;position:relative}
.queue button img{width:100%;height:100%;object-fit:cover}
.queue button[aria-current="true"]{opacity:1;box-shadow:0 0 0 2px var(--light)}
.queue button.done::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.45);font-weight:700;color:var(--ok)}
.progress{height:4px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:14px}
.progress i{display:block;height:100%;width:0;background:var(--light);transition:width .3s}

/* Remote */
.remote{max-width:420px;margin:0 auto}
.pad{position:relative;aspect-ratio:1;border-radius:36px;margin:8px auto 18px;background:radial-gradient(120% 120% at 30% 20%,rgba(255,255,255,.14),rgba(255,255,255,.04));border:1px solid var(--edge);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);touch-action:none;user-select:none;overflow:hidden}
.pad .ring{position:absolute;inset:8%;border-radius:50%;border:1px solid rgba(255,255,255,.08)}
.pad .arrow{position:absolute;width:56px;height:56px;display:grid;place-items:center;color:var(--ink3)}
.pad .arrow svg{width:26px;height:26px}
.pad .up{top:4%;left:50%;transform:translateX(-50%)}.pad .down{bottom:4%;left:50%;transform:translateX(-50%)}
.pad .left{left:4%;top:50%;transform:translateY(-50%)}.pad .right{right:4%;top:50%;transform:translateY(-50%)}
.pad .center{position:absolute;inset:32%;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);display:grid;place-items:center;font-weight:600;color:var(--ink2);font-size:15px}
.pad .ripple{position:absolute;width:90px;height:90px;margin:-45px 0 0 -45px;border-radius:50%;background:rgba(255,255,255,.22);transform:scale(0);opacity:1;pointer-events:none;animation:rip .5s var(--ease) forwards}
@keyframes rip{to{transform:scale(2.4);opacity:0}}
.pad .hint{position:absolute;bottom:14%;left:0;right:0}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.key{height:64px;border-radius:20px;background:var(--glass);border:1px solid var(--edge);display:grid;place-items:center;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);transition:transform .12s,background .2s}
.key:active{transform:scale(.93);background:var(--glass2)}
.key svg{width:24px;height:24px}
.key.tall{grid-row:span 2;height:auto}
.vol{display:grid;grid-template-rows:1fr 1fr;border-radius:20px;overflow:hidden;grid-row:span 2;background:var(--glass);border:1px solid var(--edge)}
.vol button{display:grid;place-items:center}.vol button+button{border-top:1px solid rgba(255,255,255,.08)}
.vol button svg{width:22px;height:22px}
.type{display:flex;gap:8px;margin:18px 0 0}
.type .search{min-width:0}
.apps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (min-width:700px){.apps{grid-template-columns:repeat(5,1fr)}}
.app-tile{aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:rgba(255,255,255,.06);border:1px solid var(--edge);position:relative;display:grid;place-items:center;font-size:13px;color:var(--ink2);padding:6px;text-align:center}
.app-tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.app-tile:active{transform:scale(.95)}

/* Pairing */
.pair{min-height:100vh;display:grid;place-items:center;padding:30px 22px;text-align:center}
.pair .card{max-width:440px}
.pair .glyph{width:120px;height:120px;margin:0 auto 22px;border-radius:30px;background:url(icon.png) center/cover;box-shadow:0 30px 60px -18px rgba(0,0,0,.8)}
.pair ol{text-align:left;color:var(--ink2);padding-left:22px;margin:22px auto;max-width:330px}
.pair ol li{margin:8px 0}
.pair ol b{color:var(--ink)}

.toast{position:fixed;z-index:60;left:50%;top:calc(14px + var(--safe-t));transform:translate(-50%,-140%);padding:12px 18px;border-radius:16px;background:rgba(30,32,42,.86);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:1px solid var(--edge);font-size:15px;font-weight:550;box-shadow:0 18px 40px rgba(0,0,0,.4);transition:transform .45s var(--spring),visibility 0s linear .45s;width:max-content;max-width:min(92vw,520px);display:flex;gap:10px;align-items:center}
.toast{visibility:hidden}
.toast.on{transform:translate(-50%,0);visibility:visible;transition:transform .45s var(--spring),visibility 0s}
.toast.bad{color:var(--warn)}

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => n.toLocaleString("fr-FR");

/* ---------- The TV's API ---------- */
async function api(path, opts = {}) {
  if (DEMO) return demoApi(path, opts);
  const headers = Object.assign({}, opts.headers || {});
  if (S.token) headers.Authorization = "Bearer " + S.token;
  if (opts.json !== undefined) { headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(opts.json); }
  let res;
  try { res = await fetch(path, {method: opts.method || (opts.body ? "POST" : "GET"), headers, body: opts.body}); }
  catch (e) { throw new Error("La TV ne répond pas. Elle est peut-être éteinte, ou sur un autre Wi‑Fi."); }
  let data = {};
  try { data = await res.json(); } catch (e) {}
  if (res.status === 401) { forget(); throw new Error(data.error || "Ce téléphone n'est plus connecté."); }
  if (!res.ok || data.ok === false) throw new Error(data.error || ("Erreur " + res.status));
  return data;
}
const img = id => DEMO ? demoImg(id) : `/img/${encodeURIComponent(id)}?t=${encodeURIComponent(S.token)}`;

const DEMO = /(^|[#&])demo(&|$)/.test(location.hash);
const DEMO_ITEMS = [{"id": "d0", "title": "Chapelle Saint-Léonard, Albeck", "credit": "Johann Jaritz", "license": "CC BY-SA 4.0", "u": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/79/Albeck_Benesirnitz_Leonhard-Kapelle_06052015_3266.jpg/960px-Albeck_Benesirnitz_Leonhard-Kapelle_06052015_3266.jpg", "collection": "landscape"}, {"id": "d1", "title": "Amanecer en el lago Titicaca, Puno, Perú", "credit": "Diego Delso", "license": "CC BY-SA 4.0", "u": "https://thumb.wikimedia.org/wikipedia/commons/thumb/3/35/Amanecer_en_el_lago_Titicaca%2C_Puno%2C_Per%C3%BA%2C_2015-08-01%2C_DD_01.JPG/960px-Amanecer_en_el_lago_Titicaca%2C_Puno%2C_Per%C3%BA%2C_2015-08-01%2C_DD_01.JPG", "collection": "landscape"}, {"id": "d2", "title": "Catedrales de Tara, Chile", "credit": "Diego Delso", "license": "CC BY-SA 4.0", "u": "https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d3/Catedrales_de_Tara%2C_Chile%2C_2016-02-07%2C_DD_62.JPG/960px-Catedrales_de_Tara%2C_Chile%2C_2016-02-07%2C_DD_62.JPG", "collection": "landscape"}, {"id": "d3", "title": "Cerro Aucanquilcha, Chile", "credit": "Diego Delso", "license": "CC BY-SA 4.0", "u": "https://thumb.wikimedia.org/wikipedia/commons/thumb/e/ef/Cerro_Aucanquilcha%2C_Chile%2C_2016-02-10%2C_DD_15.JPG/960px-Cerro_Aucanquilcha%2C_Chile%2C_2016-02-10%2C_DD_15.JPG", "collection": "landscape"}, {"id": "d4", "title": "Lac Louise", "credit": "Chensiyuan", "license": "CC BY-SA 4.0", "u": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6c/1_lake_louise_pano_2019.jpg/960px-1_lake_louise_pano_2019.jpg", "collection": "landscape"}, {"id": "d5", "title": "Tianzi Shan, Zhangjiajie", "credit": "chensiyuan", "license": "CC BY-SA 4.0", "u": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/77/1_tianzishan_wulingyuan_zhangjiajie_2012.jpg/960px-1_tianzishan_wulingyuan_zhangjiajie_2012.jpg", "collection": "landscape"}, {"id": "d6", "title": "Digue de Frontignan", "credit": "Christian Ferrer", "license": "CC BY 4.0", "u": "https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f2/Dike_in_Frontignan.jpg/960px-Dike_in_Frontignan.jpg", "collection": "landscape"}, {"id": "d7", "title": "Nosy Iranja, Madagascar", "credit": "Diego Delso", "license": "CC BY-SA 4.0", "u": "https://thumb.wikimedia.org/wikipedia/commons/thumb/e/ea/Nosy_Iranja%2C_Madagascar%2C_2025-09-17%2C_DD_21.jpg/960px-Nosy_Iranja%2C_Madagascar%2C_2025-09-17%2C_DD_21.jpg", "collection": "landscape"}, {"id": "d8", "title": "Hong Kong, panorama", "credit": "Ralf Roletschek", "license": "CC BY 3.0", "u": "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/58/13-08-08-hongkong-by-RalfR-Panorama2.jpg/960px-13-08-08-hongkong-by-RalfR-Panorama2.jpg", "collection": "city"}, {"id": "d9", "title": "Galerie Colbert", "credit": "Benh LIEU SONG", "license": "CC BY 3.0", "u": "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/5d/Galerie_Colbert.jpg/960px-Galerie_Colbert.jpg", "collection": "city"}, {"id": "d10", "title": "Le mont Fuji au coucher du soleil", "credit": "Romain Guy from San Francisco, USA", "license": "CC0", "u": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/66/Mount_Fuji_at_sunset%2C_March_2025.jpg/960px-Mount_Fuji_at_sunset%2C_March_2025.jpg", "collection": "city"}];
const D = DEMO ? {

async function demoApi(path, opts) {
  await new Promise(r => setTimeout(r, 150));
  const b = opts.json || {}, its = D.lib.items, p = path.split("?")[0];
  const pick = ids => its.filter(w => (ids || []).includes(w.id));
  switch (p) {
    case "/api/hello": return Object.assign({paired: true}, D.state.tv);
    case "/api/state": D.state.library.count = its.length; return D.state;
    case "/api/wallpapers": return Object.assign({active: D.state.saver.collection, max: 200}, D.lib);
    case "/api/apps": return {apps: D.apps};
    case "/api/settings":
      ["mode", "collection", "seconds", "clock", "caption"].forEach(k => { if (k in b) D.state.saver[k] = b[k]; });
      ["mood", "style"].forEach(k => { if (k in b) D.state.picks[k] = b[k]; });
      return D.state;
    case "/api/add": {
      const it = {id: "a" + (++D.n), title: b.title, credit: b.credit, license: b.license, link: b.link, remote: b.remote, source: "commons",
        collection: b.collection || "landscape", enabled: true, u: String(b.url || "").replace("/3840px-", "/960px-")};
      its.unshift(it); return {ok: true, item: it};
    }
    case "/api/upload": {
      const it = {id: "u" + (++D.n), title: "Ma photo", credit: "", source: "phone", collection: new URLSearchParams(path.split("?")[1] || "").get("collection") || "landscape",
        enabled: true, u: URL.createObjectURL(opts.body)};
      its.unshift(it); return {ok: true, item: it};
    }
    case "/api/update": pick(b.ids).forEach(w => ["collection", "enabled", "title"].forEach(k => { if (k in b) w[k] = b[k]; })); return {ok: true};
    case "/api/delete": D.lib.items = its.filter(w => !(b.ids || []).includes(w.id)); return {ok: true};
    case "/api/collections":
      if (b.action === "create") { const id = "c" + (++D.n); D.lib.collections.push({id, name: b.name}); return {ok: true, id}; }
      if (b.action === "rename") D.lib.collections.forEach(c => { if (c.id === b.id) c.name = b.name; });
      if (b.action === "delete") { D.lib.collections = D.lib.collections.filter(c => c.id !== b.id); if (b.withItems) D.lib.items = its.filter(w => w.collection !== b.id); }
      return {ok: true};
    default: return {ok: true};   // show, remote, launch: the demo TV just nods
  }
}
const demoImg = id => { const w = D.lib.items.find(x => x.id === id); return w ? w.u : ""; };

function forget() { try { localStorage.removeItem("matv.k"); } catch (e) {} S.token = null; history.replaceState(null, "", location.pathname); renderPair(); }

/* ---------- Toast ---------- */
let toastTimer;
function toast(msg, bad) {
  const t = $("#toast");
  t.className = "toast" + (bad ? " bad" : "");
  t.innerHTML = (bad ? "" : `<span style="color:var(--ok);width:18px;display:inline-grid">${I.check}</span>`) + esc(msg);
  requestAnimationFrame(() => t.classList.add("on"));
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("on"), bad ? 4200 : 2400);
}

/* ---------- Ambient light: the room takes the colour of what the TV shows ---------- */
function ambient(url) { if (url) $("#ambient").style.backgroundImage = `url("${url}")`; }

/* ---------- Boot ---------- */
async function boot() {
  if (DEMO) S.token = "demo";
  // The code stays in the address (?k=): an icon added to the iPhone's home screen keeps that address, and gets
  // storage of its own, apart from Safari's.
  const m = DEMO ? null : (location.hash.match(/k=([A-Za-z0-9_-]{20,})/) || location.search.match(/k=([A-Za-z0-9_-]{20,})/));
  if (m) { try { localStorage.setItem("matv.k", m[1]); } catch (e) {} S.token = m[1]; history.replaceState(null, "", location.pathname + "?k=" + m[1]); }
  else if (!DEMO) { try { S.token = localStorage.getItem("matv.k"); } catch (e) {} }
  if (!S.token) return renderPair();
  try {
    S.hello = await api("/api/hello");
    if (!S.hello.paired) return forget();
    await Promise.all([loadState(), loadLib()]);
  } catch (e) { if (S.token) return renderOffline(e.message); return; }
  renderShell();
  go(DEMO ? "tv" : location.hash.replace("#", "") || "tv");
  loadIndex();
}
async function loadState() { S.state = await api("/api/state"); }
async function loadLib() { S.lib = await api("/api/wallpapers"); }

const after = {};

/* ---------- Helpers for the library ---------- */
const cols = () => (S.lib && S.lib.collections) || [];
const colName = id => id === "all" ? "Toutes" : ((cols().find(c => c.id === id) || {}).name || "—");

/* ---------- The miniature TV ---------- */
function tvFrame(opts = {}) {

async function loadIndex() {
  for (const url of [LIBRARY_URL, "/library.json"]) {
    try {
      const r = await fetch(url, {cache: "no-cache"});
      if (!r.ok) continue;
      S.index = await r.json();
      if (!S.theme && S.index.themes && S.index.themes.length) S.theme = S.index.themes[0].id;
      if (S.view === "discover") render();
      return;
    } catch (e) {}
  }
  S.index = {themes: []};
  if (S.view === "discover") render();
}

/* Ideas beyond the themes: searches on Wikimedia Commons (in English, which it knows best). */
const IDEAS = [["Aurores boréales", "aurora borealis"], ["Automne", "autumn forest"], ["Hiver", "winter snow landscape"], ["Déserts", "desert dunes"],
  ["Fleurs", "flower field"], ["Lavande", "lavender field"], ["Animaux", "wildlife"], ["Oiseaux", "bird in flight"], ["Phares", "lighthouse"],
  ["Îles", "tropical island"], ["Nuit étoilée", "milky way night sky"], ["Châteaux", "castle"], ["Architecture", "architecture"],
  ["Tableaux de maîtres", "painting landscape museum"], ["Venise", "Venice"], ["Islande", "Iceland landscape"], ["Alpes", "Alps"], ["Toscane", "Tuscany"]];

async function searchCommons(q, label) {
  if (!q) { S.search = null; return render(); }
  S.search = {q, label, items: []}; S.searching = true; S.shown = 36; render();
  const p = new URLSearchParams({action: "query", format: "json", origin: "*", generator: "search", gsrsearch: q + " filetype:bitmap",
    gsrnamespace: "6", gsrlimit: "120", prop: "imageinfo", iiprop: "url|size|mime|extmetadata", iiurlwidth: "960",
    iiextmetadatafilter: "ObjectName|Artist|LicenseShortName"});
  try {
    const r = await fetch(COMMONS + "?" + p);
    const d = await r.json();
    const pages = Object.values((d.query && d.query.pages) || {}).sort((a, b) => a.index - b.index);
    const strip = s => { const t = document.createElement("div"); t.innerHTML = s || ""; return t.textContent.trim().replace(/\s+/g, " "); };
    S.search.items = pages.map(pg => {
      const ii = (pg.imageinfo || [])[0] || {}, m = ii.extmetadata || {};
      if (ii.mime !== "image/jpeg" || ii.width < 2400 || ii.width / ii.height < 1.3 || ii.width / ii.height > 2.3 || !/\/960px-/.test(ii.thumburl || "")) return null;
      return {id: pg.pageid, t: (strip(m.ObjectName && m.ObjectName.value) || pg.title.slice(5).replace(/\.[^.]+$/, "")).slice(0, 90),
        a: strip(m.Artist && m.Artist.value).slice(0, 70), l: strip(m.LicenseShortName && m.LicenseShortName.value), w: ii.width, h: ii.height,
        th: ii.thumburl, u: ii.width <= 3840 ? ii.url : ii.thumburl.replace("/960px-", "/3840px-"),
        p: "https://commons.wikimedia.org/wiki/" + encodeURIComponent(pg.title.replace(/ /g, "_"))};
    }).filter(Boolean);
  } catch (e) { S.search.failed = true; }
  S.searching = false;
  if (S.view === "discover") render();
}

async function addPick(p, collection, thenShow) {
  const key = "commons:" + p.id;
  if (S.adding.has(key)) return;
  if (remoteIds().has(key)) { if (thenShow) { const w = items().find(w => w.remote === key); if (w) return showOnTv(w.id); } return toast("Déjà sur la TV"); }
  S.adding.add(key); refreshDiscover();
  try {
    const r = await api("/api/add", {json: {url: p.u, title: p.t, credit: p.a, license: p.l, link: p.p, remote: key, source: "commons", collection}});
    S.lib.items.unshift(r.item);
    S.state.library.count++;
    toast(`Ajouté à ${colName(r.item.collection)}`);
    if (thenShow) showOnTv(r.item.id);
  } catch (e) { toast(e.message, true); }
  S.adding.delete(key); refreshDiscover();
}
function refreshDiscover() {
  if (S.view !== "discover") return;

  document.querySelectorAll("[data-quick]").forEach(b => {

}

function importPhotos() { const f = $("#files"); f.value = ""; f.onchange = () => f.files.length && sheetImport([...f.files]); f.click(); }

function sheetImport(files) {
  const jobs = files.slice(0, 30).map(f => ({file: f, url: URL.createObjectURL(f), fx: .5, fy: .5, done: false}));
  let at = 0, dest = S.filter !== "all" ? S.filter : defaultCollection(), sending = false;
  openSheet(`
    <h1 class="large" style="font-size:26px;margin-top:0">Importer</h1>
    <p class="sub" style="margin-bottom:8px">Fais glisser la photo pour choisir ce que la TV montre.</p>
    <div class="crop" id="crop"><img id="cimg" alt=""><div class="guide"></div></div>
    ${jobs.length > 1 ? `<div class="queue" id="queue">${jobs.map((j, n) => `<button data-q="${n}"><img src="${j.url}" alt=""></button>`).join("")}</div>` : ""}
    <h3>Ranger dans</h3>
    <div class="chips" id="idest">${cols().map(c => `<button class="chip" data-d="${esc(c.id)}" aria-pressed="${c.id === dest}">${esc(c.name)}</button>`).join("")}</div>
    <div class="progress" id="prog" hidden><i></i></div>
    <div class="bar"><button class="btn primary" id="send">${I.upload}Envoyer ${jobs.length > 1 ? jobs.length + " photos" : "sur la TV"}</button></div>`, sh => {
    const crop = $("#crop", sh), im = $("#cimg", sh);
    let natW = 0, natH = 0, scale = 1;
    function layout() {
      const j = jobs[at], cw = crop.clientWidth, ch = crop.clientHeight;
      scale = Math.max(cw / natW, ch / natH);
      const w = natW * scale, h = natH * scale;
      const left = Math.min(0, Math.max(cw - w, cw / 2 - j.fx * w)), top = Math.min(0, Math.max(ch - h, ch / 2 - j.fy * h));
      j.fx = (cw / 2 - left) / w; j.fy = (ch / 2 - top) / h;
      Object.assign(im.style, {width: w + "px", height: h + "px", left: left + "px", top: top + "px"});
    }
    function show(n) {
      at = n; im.onload = () => { natW = im.naturalWidth; natH = im.naturalHeight; layout(); }; im.src = jobs[n].url;
      sh.querySelectorAll("[data-q]").forEach(b => b.setAttribute("aria-current", +b.dataset.q === n));
    }
    let drag = null;
    crop.addEventListener("pointerdown", e => { drag = {x: e.clientX, y: e.clientY, fx: jobs[at].fx, fy: jobs[at].fy}; crop.setPointerCapture(e.pointerId); crop.classList.add("drag"); });
    crop.addEventListener("pointermove", e => { if (!drag) return; const j = jobs[at]; j.fx = drag.fx - (e.clientX - drag.x) / (natW * scale); j.fy = drag.fy - (e.clientY - drag.y) / (natH * scale); layout(); });
    const end = () => { drag = null; crop.classList.remove("drag"); };
    crop.addEventListener("pointerup", end); crop.addEventListener("pointercancel", end);
    sh.querySelectorAll("[data-q]").forEach(b => b.onclick = () => show(+b.dataset.q));
    sh.querySelectorAll("[data-d]").forEach(b => b.onclick = () => { dest = b.dataset.d; sh.querySelectorAll("[data-d]").forEach(x => x.setAttribute("aria-pressed", x === b)); });
    $("#send", sh).onclick = async () => {
      if (sending) return; sending = true;
      const btn = $("#send", sh), prog = $("#prog", sh); btn.disabled = true; prog.hidden = false;
      let ok = 0;
      for (let n = 0; n < jobs.length; n++) {
        const j = jobs[n];
        btn.textContent = `Envoi ${n + 1} sur ${jobs.length}…`;
        try {
          const blob = await shrink(j.file);
          const q = new URLSearchParams({collection: dest, fx: j.fx.toFixed(4), fy: j.fy.toFixed(4), title: j.file.name.replace(/\.[^.]+$/, "").replace(/[_-]+/g, " ").slice(0, 80)});
          const r = await api("/api/upload?" + q, {method: "POST", body: blob, headers: {"Content-Type": "image/jpeg"}});
          S.lib.items.unshift(r.item); ok++; j.done = true;
          const qb = sh.querySelector(`[data-q="${n}"]`); if (qb) qb.classList.add("done");
        } catch (e) { toast(e.message, true); }
        $("i", prog).style.width = ((n + 1) / jobs.length * 100) + "%";
      }
      S.state.library.count = S.lib.items.length;
      closeSheet(); jobs.forEach(j => URL.revokeObjectURL(j.url));
      if (ok) { toast(ok > 1 ? `${ok} photos ajoutées` : "Photo ajoutée"); if (S.view === "library" || S.view === "tv") render(); }
    };
    show(0);
  });
}
/* Big photos are made lighter on the phone (3840 px on the long side): faster over Wi‑Fi, same result on the TV. */
async function shrink(file) {
  try {
    const bmp = await createImageBitmap(file, {imageOrientation: "from-image"});
    const k = Math.min(1, 3840 / Math.max(bmp.width, bmp.height));
    if (k === 1 && file.type === "image/jpeg" && file.size < 12e6) { bmp.close && bmp.close(); return file; }
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height); bmp.close && bmp.close();
    return await new Promise(r => c.toBlob(r, "image/jpeg", .92));
  } catch (e) { return file; }
}

/* ---------- Télécommande ---------- */
function viewRemote() {
  return `
  <h1 class="large">Télécommande</h1>
  <p class="sub">Glisse sur le pavé pour te déplacer, touche-le pour valider.</p>
  <div class="remote">
    <button class="btn small power" data-key="power" aria-label="Allumer ou mettre en veille la TV">${I.power}Allumer / Veille</button>
    <div class="pad" id="pad" role="application" aria-label="Pavé tactile">
      <div class="ring"></div>
      <button class="arrow up" data-key="up" aria-label="Haut">${I.up}</button>
      <button class="arrow down" data-key="down" aria-label="Bas">${I.down}</button>
      <button class="arrow left" data-key="left" aria-label="Gauche">${I.left}</button>
      <button class="arrow right" data-key="right" aria-label="Droite">${I.right}</button>
      <div class="center">OK</div>
    </div>
    <div class="keys">
      <button class="key" data-key="back" aria-label="Retour">${I.back}</button>
      <button class="key" data-key="home" aria-label="Accueil">${I.home}</button>
      <button class="key" data-key="play" aria-label="Lecture ou pause">${I.pp}</button>
      <div class="vol"><button data-key="volup" aria-label="Monter le son">${I.volup}</button><button data-key="voldown" aria-label="Baisser le son">${I.voldown}</button></div>
      <button class="key" data-key="menu" aria-label="Menu">${I.menu}</button>
      <button class="key" data-key="mute" aria-label="Couper le son">${I.mute}</button>
      <button class="key" data-act="show" aria-label="Lancer les fonds">${I.discover}</button>
    </div>
    <div class="type"><label class="search">${I.search}<input id="txt" placeholder="Écrire sur la TV" enterkeyhint="send" autocomplete="off"></label>
      <button class="btn small" data-act="send">Envoyer</button></div>
  </div>
  <h2>Applis</h2>
  <div class="apps" id="apps">${S.apps ? appsHtml() : `<p class="note">Chargement…</p>`}</div>`;
}
const appsHtml = () => S.apps.map(a => `<button class="app-tile" data-app="${esc(a.pkg)}" aria-label="${esc(a.name)}"><span>${esc(a.name)}</span>${DEMO ? "" : `<img loading="lazy" src="/icon/${encodeURIComponent(a.pkg)}?t=${encodeURIComponent(S.token)}" alt="" onerror="this.remove()">`}</button>`).join("");
after.remote = async () => {
  const pad = $("#pad");
  let start = null;
  pad.addEventListener("pointerdown", e => { if (e.target.closest("[data-key]")) return; start = {x: e.clientX, y: e.clientY, t: Date.now()}; pad.setPointerCapture(e.pointerId); });
  pad.addEventListener("pointermove", e => {
    if (!start) return;
    const dx = e.clientX - start.x, dy = e.clientY - start.y;
    if (Math.hypot(dx, dy) > 42) { key(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up")); start = {x: e.clientX, y: e.clientY, t: Date.now(), moved: true}; }
  });
  pad.addEventListener("pointerup", e => {
    if (start && !start.moved && Date.now() - start.t < 450) {
      const r = pad.getBoundingClientRect(), rip = document.createElement("i");
      rip.className = "ripple"; rip.style.left = (e.clientX - r.left) + "px"; rip.style.top = (e.clientY - r.top) + "px";
      pad.appendChild(rip); setTimeout(() => rip.remove(), 600); key("ok");
    }
    start = null;
  });
  $("#txt").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); sendText(); } });
  if (!S.apps) { try { S.apps = (await api("/api/apps")).apps; } catch (e) { S.apps = []; } const a = $("#apps"); if (a && S.view === "remote") a.innerHTML = appsHtml(); }
};
let keyChain = Promise.resolve();
function key(k) {
  buzz();
  keyChain = keyChain.then(() => api("/api/remote", {json: {key: k}})).catch(e => toast(e.message, true));
}
function sendText() { const t = $("#txt"); if (!t.value) return; const v = t.value; t.value = ""; api("/api/remote", {json: {text: v}}).then(() => toast("Texte envoyé")).catch(e => toast(e.message, true)); }

/* ---------- Sheets ---------- */
function openSheet(html, wire) {
  const sh = $("#sheet");
  sh.innerHTML = `<div class="top"><div class="grab"></div><button class="close" aria-label="Fermer">${I.x}</button></div>` + html;
  $(".close", sh).onclick = closeSheet;
  $("#scrim").classList.add("on"); sh.scrollTop = 0;
  requestAnimationFrame(() => sh.classList.add("on"));
  wire && wire(sh);
}
/** A name to type (a collection's): a sheet with a field, not the browser's prompt. */
function askName(title, value, action, done) {
  openSheet(`<h2 style="margin-top:4px">${esc(title)}</h2>
    <label class="search" style="margin:14px 0 16px"><input id="nm" maxlength="40" placeholder="Ex. : Montagnes, Vacances 2025…" value="${esc(value)}" enterkeyhint="done" autocomplete="off"></label>
    <button class="btn primary" id="nmok" style="width:100%">${esc(action)}</button>`, sh => {
    const f = $("#nm", sh), go = async () => {
      const name = f.value.trim(); if (!name) return f.focus();
      try { await done(name); closeSheet(); } catch (x) { toast(x.message, true); }
    };
    $("#nmok", sh).onclick = go;
    f.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); go(); } });
    setTimeout(() => f.focus(), 350);
  });
}
function closeSheet() { $("#sheet").classList.remove("on"); $("#scrim").classList.remove("on"); }
$("#scrim").onclick = closeSheet;
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });
(() => { let y0 = null; const sh = $("#sheet");
  sh.addEventListener("touchstart", e => { y0 = sh.scrollTop <= 0 ? e.touches[0].clientY : null; }, {passive: true});
  sh.addEventListener("touchend", e => { if (y0 !== null && e.changedTouches[0].clientY - y0 > 110) closeSheet(); y0 = null; }, {passive: true}); })();

/* ---------- One click handler for everything ---------- */
async function onClick(e) {
  const t = e.target.closest("button,[data-quick]");
  if (!t) return;
  const d = t.dataset;
  if (d.go) return go(d.go);
  if (d.key) return key(d.key);
  if (d.quick !== undefined) {
    e.stopPropagation();
    const p = themeItems()[+d.quick];
    if (p) addPick(p, defaultCollection(), false);
    return;
  }
  if (d.pick !== undefined) return sheetPick(themeItems()[+d.pick]);
  if (d.theme) { S.theme = d.theme; S.shown = 36; return render(); }
  if (d.idea) { const [fr, en] = IDEAS[+d.idea]; window.scrollTo(0, 0); return searchCommons(en, fr); }
  if (d.filter) { S.filter = d.filter; return render(); }
  if (d.app) { buzz(); return api("/api/launch", {json: {pkg: d.app}}).then(() => toast("Ouvert sur la TV")).catch(x => toast(x.message, true)); }
  if (d.wall) {
    if (S.selecting) {
      S.selected.has(d.wall) ? S.selected.delete(d.wall) : S.selected.add(d.wall); t.classList.toggle("sel");
      const sub = document.querySelector("#main .sub"); if (sub) sub.textContent = `${fmt(S.selected.size)} sélectionné${S.selected.size > 1 ? "s" : ""} · touche les fonds à modifier`;
      return selbar();
    }
    const w = items().find(x => x.id === d.wall); return w && sheetWall(w);
  }
  if (d.set) return setSaver(d.set, d.v, t);
  switch (d.act) {
    case "show": return showOnTv(null);
    case "import": return importPhotos();
    case "more": S.shown += 36; return render();
    case "clear": S.search = null; return render();
    case "send": return sendText();
    case "select": S.selecting = !S.selecting; S.selected.clear(); return render();
    case "newcol":
      return askName("Nouvelle collection", "", "Créer", async name => {
        const r = await api("/api/collections", {json: {action: "create", name}}); await loadLib(); S.filter = r.id; render(); toast("Collection créée");
      });
    case "rencol":
      return askName("Renommer la collection", colName(S.filter), "Renommer", async name => {
        await api("/api/collections", {json: {action: "rename", id: S.filter, name}}); await loadLib(); render(); toast("Collection renommée");
      });
    case "delcol": {
      const n = items().filter(w => w.collection === S.filter).length;
      const withItems = n > 0 && confirm(`Supprimer aussi ses ${n} fonds ?\nOK : les supprimer. Annuler : les garder dans une autre collection.`);
      if (!confirm(`Supprimer la collection « ${colName(S.filter)} » ?`)) return;
      try { await api("/api/collections", {json: {action: "delete", id: S.filter, withItems}}); await Promise.all([loadLib(), loadState()]); S.filter = "all"; render(); toast("Collection supprimée"); } catch (x) { toast(x.message, true); }
      return;
    }
    case "bulkdel": if (confirm(`Supprimer ${S.selected.size} fonds de la TV ?`)) await removeWalls([...S.selected]); return;
    case "bulkrot": { const ids = [...S.selected], on = !items().filter(w => ids.includes(w.id)).every(w => w.enabled); await update(ids, {enabled: on}); toast(on ? "Remis en rotation" : "Retirés de la rotation"); return; }
    case "bulkmove": {
      const ids = [...S.selected];
      openSheet(`<h1 class="large" style="font-size:26px;margin-top:0">Déplacer ${ids.length} fonds</h1><div class="chips" style="flex-wrap:wrap;margin:12px 0 0">${cols().map(c => `<button class="chip" data-to="${esc(c.id)}">${esc(c.name)}</button>`).join("")}</div>`, sh => {
        sh.querySelectorAll("[data-to]").forEach(b => b.onclick = async () => { closeSheet(); await update(ids, {collection: b.dataset.to}); S.selected.clear(); render(); toast("Rangés dans " + colName(b.dataset.to)); });
      });
      return;
    }
  }
}
async function setSaver(name, v, el) {
  const change = {};
  if (name === "clock" || name === "caption") change[name] = el.getAttribute("aria-checked") !== "true";
  else if (name === "seconds") change.seconds = +v;
  else change[name] = v;
  if (name === "collection" && S.state.saver.mode !== "art") change.mode = "art";
  try {
    S.state = await api("/api/settings", {json: change}); render();
    if (name === "mood") toast("Nouvelles suggestions en route sur la TV");
  } catch (x) { toast(x.message, true); }
}

window.addEventListener("hashchange", () => { const v = location.hash.replace("#", ""); if (S.lib && v && v !== S.view && TABS.some(t => t[0] === v)) go(v); });
document.addEventListener("visibilitychange", async () => { if (!document.hidden && S.lib) { try { await Promise.all([loadState(), loadLib()]); if (S.view !== "remote") render(); } catch (e) {} } });
boot();
</script>
