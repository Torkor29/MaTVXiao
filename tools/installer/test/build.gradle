plugins { id 'com.android.application' version '8.7.3' }
def L = "$rootDir/../../../installer"
android {
    namespace 'io.matv.installer'
    compileSdk 34
    defaultConfig { applicationId 'io.matv.installer'; minSdk 26; targetSdk 34 }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    sourceSets.main {
        manifest.srcFile "$L/app/AndroidManifest.xml"
        java.srcDirs = ["$L/app/src"]
        res.srcDirs = ["$L/app/res"]
    }
    testOptions.unitTests { includeAndroidResources = true; all { maxHeapSize = '3g'; jvmArgs '--add-opens=java.base/java.nio=ALL-UNNAMED'; systemProperty 'robolectric.graphicsMode', 'NATIVE'; systemProperty 'shots', "$rootDir/shots"; systemProperty 'certs', "$rootDir/certs"; testLogging.showStandardStreams = true } }
    lint { abortOnError false; checkReleaseBuilds false }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
