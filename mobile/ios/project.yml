# The iPhone app's Xcode project, generated by XcodeGen (`brew install xcodegen`, then `xcodegen` here).
name: MaTV
options:
  bundleIdPrefix: io.matv
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  MaTV:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
      # MaTV Connect, the web app the TV serves, for the demo ("Essayer sans TV"): the same files.
      - path: ../../launcher/app/assets/connect
        type: folder
        buildPhase: resources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: MaTV
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIStatusBarStyle: UIStatusBarStyleLightContent
        NSLocalNetworkUsageDescription: "MaTV cherche tes TV sur le Wi‑Fi et s'y connecte, pour y installer MaTV et les piloter."
        NSBonjourServices: [_androidtvremote2._tcp, _googlecast._tcp]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSCameraUsageDescription: "Pour prendre une photo et l'envoyer comme fond d'écran sur ta TV."
        NSPhotoLibraryUsageDescription: "Pour choisir des photos à envoyer comme fonds d'écran sur ta TV."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.matv.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: NO
  MaTVTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: MaTV
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.matv.app.tests
  MaTVUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: MaTV
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.matv.app.uitests
        TEST_TARGET_NAME: MaTV
schemes:
  MaTV:
    build:
      targets:
        MaTV: all
    test:
      targets: [MaTVTests, MaTVUITests]
